# Local model registry configuration
# Root directory for all durable registry data (metadata, content, journal, uploads)
registry.storage-path=${REGISTRY_STORAGE_PATH:data/registry}

# Content verification algorithm required at registration.
# Every upload must present the checksum produced by this algorithm.
registry.checksum-algorithm=SHA-256

# Interrupted uploads left behind by a crash are automatically reclaimed at startup.
registry.reclaim-incomplete-uploads=true

# Retain content bytes of RETIRED versions (metadata + audit are always retained).
registry.retain-retired-content=true
